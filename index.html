<style>
/* Layout: full-bleed aerial map; one instrument-style panel (left rail on desktop, bottom sheet on phones); compass top-right. */
:root {
  --bg: #e9efee;
  --surface: #fbfcfb;
  --surface-2: #f1f5f4;
  --ink: #13222a;
  --muted: #56686d;
  --line: #d2dcdb;
  --accent: #b01a20;
  --accent-ink: #ffffff;
  --accent-fill: #b01a20;   /* filled buttons with white text */
  --accent-soft: #f6e3e3;
  --link: #0d6b78;
  --water: #15282e;
  --pin: #b01a20;
  --pin-ink: #ffffff;
  --shadow: 0 10px 30px rgba(10, 30, 36, .22), 0 1px 3px rgba(10, 30, 36, .18);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --peek: 148px;
  --sheet-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d171b; --surface: #12212a; --surface-2: #182b33; --ink: #e3ecec; --muted: #94a8ac;
    --line: #263c44; --accent: #ea6369; --accent-fill: #c42a30; --accent-ink: #ffffff; --accent-soft: #3a1e22; --link: #6cc6d2;
    --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d171b; --surface: #12212a; --surface-2: #182b33; --ink: #e3ecec; --muted: #94a8ac;
  --line: #263c44; --accent: #ea6369; --accent-fill: #c42a30; --accent-ink: #ffffff; --accent-soft: #3a1e22; --link: #6cc6d2;
  --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--water); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
#app { position: relative; height: 100%; }
#map { position: absolute; inset: 0; background: var(--water); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

/* ---------- panel ---------- */
#panel {
  position: absolute; z-index: 800; top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; width: 372px;
  background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.handle { display: none; }
.sbar, #menuBtn, #menu { display: none; }
.head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.brand { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: .95; letter-spacing: .01em; text-transform: uppercase; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface-2); flex: none; }
.lang button { border: 0; background: none; padding: 4px 10px; border-radius: 999px; font-family: var(--f-data); font-size: 12px; font-weight: 600; letter-spacing: .06em; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
.btn-pdf {
  display: flex; align-items: center; gap: 10px; text-align: left; border: 0; cursor: pointer;
  background: var(--accent-fill); color: var(--accent-ink); border-radius: 10px; padding: 8px 12px; min-width: 0;
}
.btn-pdf svg { flex: none; }
.btn-pdf b { display: block; font-weight: 700; font-size: 15px; line-height: 1.15; }
.btn-pdf small { display: block; font-size: 12px; opacity: .88; line-height: 1.2; }
.btn-pdf[aria-busy="true"] { opacity: .7; cursor: progress; }
.btn-ig {
  display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 14px;
}
.tabs { display: flex; gap: 4px; }
.tabs button {
  flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 8px; cursor: pointer;
  font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.note { margin: 0; font-size: 13px; color: var(--muted); }
#status { font-size: 13px; color: var(--muted); min-height: 0; }
#status:empty { display: none; }
#status a { color: var(--link); font-weight: 600; }

.body { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.view { padding: 8px 10px 18px; }
.view-pad { padding: 16px 18px 22px; display: grid; gap: 14px; }

/* list */
.list { list-style: none; margin: 0; padding: 0; }
.list button {
  width: 100%; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left;
  border: 0; background: none; padding: 8px 8px; border-radius: 10px; cursor: pointer;
}

/* photos of the attraction: thumbnails in the detail view, viewer on top of everything */

}
.facts { display: grid; gap: 10px; margin: 0; }

.routes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.routes li { border-bottom: 1px solid var(--line); }
.routes button {
  width: 100%; border: 0; background: none; cursor: pointer; text-align: left;
  display: grid; grid-template-columns: 22px 58px 58px 1fr; gap: 8px; align-items: center; padding: 9px 4px;
}

/* info / contact */

/* ---------- map furniture ---------- */
.ctrl { position: absolute; z-index: 700; }

#zoom { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-auto-flow: column; gap: 6px; }

}
/* one row: − and + joined in one block with a divider, "whole map" apart on the right */

#zoom .zi { order: 2; border-radius: 0 10px 10px 0; margin-left: -6px; border-left: 1px solid var(--line); }

/* 22.11: mode switch and label toggles in one row; they wrap to a second row when the screen is too narrow
   (room is left for the compass in the top right corner) */
#layers { top: 16px; left: 404px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: calc(100vw - 404px - 120px); }
#layers .lay-hint { flex-basis: 100%; }
.lay { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
.lay button {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer;
  padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted);
}

.lay-hint { max-width: min(240px, calc(100vw - 140px)); font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.9); padding-left: 4px; }
#scale { left: 404px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); color: #fff; font-family: var(--f-data); font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.9); pointer-events: none; }
#scale .bar { height: 6px; border: 2px solid #fff; border-top: 0; box-shadow: 0 1px 2px rgba(0,0,0,.7); margin-top: 2px; }

/* markers + labels (sit on the photo, so fixed colors) */
.pin {
  width: 100%; height: 100%; border-radius: 50%; background: var(--pin); color: var(--pin-ink);
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1;
  border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.55); box-sizing: border-box; cursor: pointer;

}

/* route labels: always centred ON their own line (see layoutLabels) */

  position: absolute; z-index: 900; left: 50%; transform: translateX(-50%); top: 16px;
  background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow);
}

.mode { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
.mode button {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer;

@keyframes pinPulse {

.plan-tips { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
.plan-sum { display: grid; grid-template-columns: 1.15fr .85fr 1fr; gap: 8px; margin: 0; }
.plan-sum div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.plan-sum dt { font-family: var(--f-data); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

.stops { list-style: none; margin: 0; padding: 0; }

/* ---------- phones: bottom sheet (portrait) / floating card (landscape) ---------- */
/* the same query string is in JS (MQ) */
/* 22.11: also tablets held upright (up to 900 px): a side panel left the lake a narrow strip */
@media (max-width: 760px), (max-height: 520px) and (orientation: landscape), (max-width: 900px) and (orientation: portrait) {
  #panel {

let lang = 'pl';
try { const s = localStorage.getItem('koparki-lang'); if (s === 'en' || s === 'pl') lang = s; } catch (e) {}
// ?lang=en / ?lang=pl in the address wins over the remembered choice (link to the English version, 22.11)
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'pl') { lang = q; localStorage.setItem('koparki-lang', q); } } catch (e) {}
// the address follows the language: ?lang=en for English, nothing for Polish (the default); hash kept
const TITLE_PL = document.title;   // set by the build (Polish); English below
function langUrl(l) {
  try { const u = new URL(location.href); if (l === 'en') u.searchParams.set('lang', 'en'); else u.searchParams.delete('lang');
    history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (e) {}
}
const t = () => T[lang];
function n(v) { return Number(v).toLocaleString(lang === 'pl' ? 'pl-PL' : 'en-GB', { maximumFractionDigits: 1 }); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ------------------------------------------------------------ data
const P = {}; D.punkty.forEach(p => P[p.id] = p);
const byNr = {}; D.punkty.forEach(p => byNr[p.nr] = p);
const name = p => lang === 'pl' ? p.pl : p.en;
const desc = p => lang === 'pl' ? p.opis_pl : p.opis_en;
// depth ("15 m*") opens the description; it is shown next to the name, the rest stays below
const DEP = /^\s*((?:ok\.\s*|approx\.\s*)?\d+(?:[.,]\d+)?\s*m\*?)(?![\w])\s*(?:·\s*)?/;   // 22.11: depth without asterisk
const depth = p => { const m = DEP.exec(desc(p) || ''); return m ? m[1] : ''; };
const descRest = p => (desc(p) || '').replace(DEP, '');
// plan do druku jako obraz pod lista atrakcji (ten sam plik co w wyszukiwarce grafik)
const planFig = L_ => { const o = PLANIMG[lang === 'pl' ? 'PL' : 'EN']; return o ? `<figure class="plan-fig"><a href="${o.obraz}"><img src="${o.podglad}" alt="${esc(L_.planAlt)}" width="${o.w_podglad}" height="${o.h_podglad}" loading="lazy"></a>` +
  `<figcaption>${L_.planCap}: <a href="${o.obraz}">${L_.planJpg}</a> · <a href="${o.pdf}">PDF A4</a> · <a href="${lang === 'pl' ? 'https://creativecommons.org/licenses/by-sa/4.0/deed.pl' : 'https://creativecommons.org/licenses/by-sa/4.0/'}" target="_blank" rel="noopener license">CC BY-SA 4.0</a></figcaption></figure>` : ''; };
const depTag = p => depth(p) ? `<span class="dep">${esc(depth(p))}</span>` : '';
const order = D.punkty.slice().sort((a, b) => (parseInt(a.nr) - parseInt(b.nr)) || a.nr.localeCompare(b.nr));
function routesOf(id) {
  return D.krawedzie.filter(k => k.a === id || k.b === id).map(k => {
    const from = k.a === id, o = P[from ? k.b : k.a];
    return { k, other: o, az: from ? k.ab : k.ba, m: k.m, dx: o.x - P[id].x, dy: o.y - P[id].y };
  }).sort((u, v) => u.m - v.m);
}
const az = v => (Math.floor(v + 0.5) % 360) + '°';   // same rounding as the print plan
const dm = v => Math.round(v) + ' m';
const arrow = (dx, dy, cls) => `<svg class="${cls || ''}" viewBox="0 0 16 16" style="transform:rotate(${Math.atan2(dy, dx) * 180 / Math.PI}deg)" aria-hidden="true"><path d="M2 8h10M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// ------------------------------------------------------------ map
const ZN = D.zmax;
const map = L.map('map', {
  crs: L.CRS.Simple, zoomControl: false, attributionControl: false,
  zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 90, maxZoom: ZN + 2, minZoom: -3,
  bounceAtZoomLimits: false, trackResize: false   // resizing is handled below (onResize)
});
const LL = (x, y) => map.unproject([x, y], ZN);
const imgB = L.latLngBounds(LL(0, D.wys), LL(D.szer, 0));
L.tileLayer('kafle/{z}/{x}_{y}.jpg', {
  tileSize: D.kafel, minNativeZoom: 0, maxNativeZoom: ZN, minZoom: -3, maxZoom: ZN + 2,
  bounds: imgB, noWrap: true, keepBuffer: 3, updateWhenIdle: false
}).addTo(map);
// generous slack: the lake is a wide strip, and on a phone in portrait the panel covers
// half the screen; on a desktop the side panel covers ~420 px on the left, and with the
// whole lake fitted in a narrow window that is more than a whole image width, so a tight
// box pinned the left points under the panel

// than a tight box, Leaflet then re-centres the view after every move and the map
// snapped back under the open sheet (19.11).
map.setMaxBounds(L.latLngBounds(LL(-D.szer * 1.5, D.wys * 9), LL(D.szer * 2.5, -D.wys * 8)));

// everything except the point markers: hidden in the route planning mode
const viewG = L.layerGroup().addTo(map);

// own layer, shown also in the route planning mode (22.11)
const drawG = L.layerGroup().addTo(map);

D.obrysy.forEach(o => {

  (o.linie || []).forEach(l => L.polyline(LLs(l), o.rura ? { color: '#373c42', weight: 2, opacity: .8, interactive: false } : { color: '#fff', weight: 1.5, opacity: .9, interactive: false }).addTo(drawG));
});

// routes
const lines = [];
D.krawedzie.forEach(k => {
  const a = P[k.a], b = P[k.b], ll = [LL(a.x, a.y), LL(b.x, b.y)];
  const casing = L.polyline(ll, { color: '#fff', weight: 5, opacity: .8, interactive: false }).addTo(viewG);
  const core = L.polyline(ll, { color: '#13222a', weight: 2.2, opacity: .95, interactive: false }).addTo(viewG);
  const hit = L.polyline(ll, { color: '#000', weight: 18, opacity: 0, bubblingMouseEvents: false }).addTo(viewG);
  hit.on('click', e => edgePopup(k, e.latlng));
  const lbl = L.marker(LL((a.x + b.x) / 2, (a.y + b.y) / 2), {
    interactive: false, keyboard: false,
    icon: L.divIcon({ className: '', html: `<div class="lbl">${dm(k.m)}</div>`, iconSize: [0, 0] })

  lines.push({ k, casing, core, lbl, txt: dm(k.m) });
});
function edgePopup(k, at) {
  const a = P[k.a], b = P[k.b];
  L.popup({ maxWidth: 260 }).setLatLng(at).setContent(
    `<b>${esc(a.nr)} ${esc(name(a))} ↔ ${esc(b.nr)} ${esc(name(b))}</b><br>${dm(k.m)}` +
    `<span class="pz">${esc(a.nr)} → ${esc(b.nr)}: ${az(k.ab)}<br>${esc(b.nr)} → ${esc(a.nr)}: ${az(k.ba)}</span>`
  ).openOn(map);
}

// points
const marks = {};
order.forEach(p => {   // 22.11: in number order, so Tab goes 1, 2, 3, 3a … over the map
  const small = p.maly || p.nr === '7b', s = small ? 22 : 30;
  const m = L.marker(LL(p.x, p.y), {
    title: `${p.nr} ${name(p)}`, riseOnHover: true,
    icon: L.divIcon({ className: '', html: `<div class="pin${small ? ' small' : ''}">${esc(p.nr)}</div>`, iconSize: [s, s], iconAnchor: [s / 2, s / 2] })
  }).addTo(map);
  const act = () => mode === 'plan' ? addStop(p.id) : select(p.id, { move: map.getZoom() < 2 ? 'fit' : 'reveal' });
  m.on('click', act);
  // 22.11: keyboard — markers take focus, Leaflet itself handles Enter only for popups
  m.on('keydown', e => { const k = e.originalEvent.key; if (k === 'Enter' || k === ' ') { e.originalEvent.preventDefault(); act(); } });
  marks[p.id] = m;
});
// leaders of bearing and of distance callouts are kept apart, so each set
// is shown or hidden together with its own labels (checkboxes)
const leaders = L.layerGroup().addTo(viewG), leadersAz = L.layerGroup(), leadersDist = L.layerGroup();
const genAz = [];
D.krawedzie.forEach(k => [[k.a, k.b, k.ab], [k.b, k.a, k.ba]].forEach(([f, t_, a]) => {
  const dx = P[t_].x - P[f].x, dy = P[t_].y - P[f].y;
  const mk = L.marker(LL(P[f].x, P[f].y), { interactive: false, keyboard: false, zIndexOffset: 900,
    icon: L.divIcon({ className: '', html: `<div class="lbl az">${arrow(dx, dy)}${az(a)}</div>`, iconSize: [0, 0] }) }).addTo(viewG);
  genAz.push({ mk, from: f, to: t_, txt: az(a) });
}));
let showAz = true, showDist = true;
try { const v = JSON.parse(localStorage.getItem('koparki-labels') || '{}'); if (v.az === false) showAz = false; if (v.dist === false) showDist = false; } catch (e) {}

// ------------------------------------------------------------ panel
const $ = id => document.getElementById(id);

const mq = window.matchMedia(MQ);
const mqSide = window.matchMedia('(max-height: 520px) and (orientation: landscape)');
let view = 'list', sel = null, sheet = 'peek', mode = 'view';

// sheet heights: portrait = peek / half / full, landscape card = peek / full
function snaps() {

      g.fillStyle = MUT; if (d !== null) g.fillText(n(d) + ' m', R[1] - mm(1.5), mid);
      if (lg) { g.fillStyle = RED; g.fillText(az(lg.az), R[2] - mm(1.5), mid); g.fillStyle = INK; g.fillText(dm(lg.m), R[3] - mm(1.5), mid); }
      g.fillStyle = INK; g.fillText(dm(cumAt[i]), R[4], mid);
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      y += rowH;
      g.strokeStyle = LINE; g.lineWidth = mm(.2); g.beginPath(); g.moveTo(tx0, y); g.lineTo(tEnd, y); g.stroke();
    }
  });

  // footer (22.11): QR code to the Instagram profile in the bottom right corner, as on the
  // print plan (same image, 29 modules, no margin of its own); left of it one short
  // paragraph (bearings, accuracy, licence) along the bottom edge, no depth notes
  const qx = mm(297 - M - QS), qy = mm(qTop);
  const qr = await loadImg(QR_IG);
  if (qr) { g.imageSmoothingEnabled = false; g.drawImage(qr, qx, qy, mm(QS), mm(QS)); g.imageSmoothingEnabled = true; }
  font(600, 2.1, FM); g.fillStyle = MUT; g.textAlign = 'center';
  g.fillText('@deeperbluediving', qx + mm(QS / 2), mm(210 - MB));
  g.textAlign = 'left';
  font(400, 2.3, FB); g.fillStyle = MUT;
  const maxW = qx - mm(M) - mm(6), lines = [];
  let cur = '';
  `${L_.planNote} ${L_.pdfFoot} ${L_.pdfLicense}`.split(' ').forEach(w => { const tr = cur ? cur + ' ' + w : w; if (g.measureText(tr).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tr; });
  if (cur) lines.push(cur);
  lines.forEach((l, i) => g.fillText(l, mm(M), mm(210 - MB) - (lines.length - 1 - i) * mm(3.3)));
  c.uklad.stopka = lines.slice();
  return c;
}

function setMode(m) {
  if (m === mode) return;
  mode = m;
  $('app').classList.toggle('plan', m === 'plan');
  $('mView').setAttribute('aria-pressed', String(m === 'view'));
  $('mPlan').setAttribute('aria-pressed', String(m === 'plan'));
  map.closePopup(); $('ptoast').hidden = true;
  if (m === 'plan') {
    hintOff = false;
    viewG.remove(); planG.addTo(map);
    Object.values(marks).forEach(mk => { const el = mk.getElement(); if (el) el.classList.remove('on'); });
  } else {
    planG.remove(); viewG.addTo(map);
  }
  view = mainView();
  chrome(); render(); drawPlan();
  if (m === 'plan') setTimeout(revealPlan, 50);
  if (m === 'view') { drawSel(); try { history.replaceState(null, '', sel ? '#p' + P[sel].nr : location.pathname + location.search); } catch (e) {} }
  else setHash();
}
$('mView').onclick = () => setMode('view');
$('mPlan').onclick = () => setMode('plan');
try { const v = JSON.parse(localStorage.getItem('koparki-trasa') || '[]'); if (Array.isArray(v)) parseRoute(v); } catch (e) {}
function fromHash() {
  const m = location.hash.match(/^#trasa(?:=([\w.]*))?$/);
  if (!m) return false;
  if (m[1]) { parseRoute(m[1].split('.').map(nr => byNr[nr] && byNr[nr].id).filter(Boolean)); savePlan(); }
  setMode('plan'); drawPlan(); planHint();
  if (view === 'plan') render();
  return true;
}

// ------------------------------------------------------------ start
// a phone held upright starts with the sheet half open (the list of sites) and the
// whole lake fitted into the free area above it; elsewhere the sheet starts folded
const sheet0 = () => mq.matches && !mqSide.matches ? 'half' : 'peek';
placeHead(); chrome(); render(); setSheet(sheet0());
requestAnimationFrame(() => {
  setSheet(sheet0());
  map.invalidateSize();
  refit();
  zoomCls(); layoutLabels();
  if (fromHash()) return;
  const h = (location.hash.match(/^#p(\w+)$/) || [])[1];
  if (h && byNr[h]) select(byNr[h].id, { move: 'fit' });
});
window.addEventListener('hashchange', () => {
  if (fromHash()) return;
  const h = (location.hash.match(/^#p(\w+)$/) || [])[1];
  if (h && byNr[h] && byNr[h].id !== sel) select(byNr[h].id, { move: 'fit' });
});
