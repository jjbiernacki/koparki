<title>Koparki · mapa nurkowa</title>
<meta name="description" content="Interaktywna mapa nurkowa zalanego wyrobiska Koparki: atrakcje, trasy z azymutami magnetycznymi, plan do druku.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>/*LEAFLET_CSS*/</style>
<style>
/* Layout: full-bleed aerial map; one instrument-style panel (left rail on desktop, bottom sheet on phones); compass top-right. */
:root {
  --bg: #e9efee;
  --surface: #fbfcfb;
  --surface-2: #f1f5f4;
  --ink: #13222a;
  --muted: #56686d;
  --line: #d2dcdb;
  --accent: #b01a20;
  --accent-ink: #ffffff;
  --accent-soft: #f6e3e3;
  --link: #0d6b78;
  --water: #15282e;
  --pin: #b01a20;
  --pin-ink: #ffffff;
  --shadow: 0 10px 30px rgba(10, 30, 36, .22), 0 1px 3px rgba(10, 30, 36, .18);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --peek: 148px;
  --sheet-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d171b; --surface: #12212a; --surface-2: #182b33; --ink: #e3ecec; --muted: #94a8ac;
    --line: #263c44; --accent: #e5535a; --accent-ink: #ffffff; --accent-soft: #3a1e22; --link: #6cc6d2;
    --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d171b; --surface: #12212a; --surface-2: #182b33; --ink: #e3ecec; --muted: #94a8ac;
  --line: #263c44; --accent: #e5535a; --accent-ink: #ffffff; --accent-soft: #3a1e22; --link: #6cc6d2;
  --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--water); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
#app { position: relative; height: 100%; }
#map { position: absolute; inset: 0; background: var(--water); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

/* ---------- panel ---------- */
#panel {
  position: absolute; z-index: 800; top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; width: 372px;
  background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.handle { display: none; }
.sbar, #menuBtn, #menu { display: none; }
.head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.brand { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: .95; letter-spacing: .01em; text-transform: uppercase; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface-2); flex: none; }
.lang button { border: 0; background: none; padding: 4px 10px; border-radius: 999px; font-family: var(--f-data); font-size: 12px; font-weight: 600; letter-spacing: .06em; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.btn-pdf {
  display: flex; align-items: center; gap: 10px; text-align: left; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 8px 12px; min-width: 0;
}
.btn-pdf svg { flex: none; }
.btn-pdf b { display: block; font-weight: 700; font-size: 15px; line-height: 1.15; }
.btn-pdf small { display: block; font-size: 12px; opacity: .88; line-height: 1.2; }
.btn-pdf[aria-busy="true"] { opacity: .7; cursor: progress; }
.btn-ig {
  display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 14px;
}
.tabs { display: flex; gap: 4px; }
.tabs button {
  flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 8px; cursor: pointer;
  font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.note { margin: 0; font-size: 13px; color: var(--muted); }
#status { font-size: 13px; color: var(--muted); min-height: 0; }
#status:empty { display: none; }
#status a { color: var(--link); font-weight: 600; }

.body { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.view { padding: 8px 10px 18px; }
.view-pad { padding: 16px 18px 22px; display: grid; gap: 14px; }

/* list */
.list { list-style: none; margin: 0; padding: 0; }
.list button {
  width: 100%; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left;
  border: 0; background: none; padding: 8px 8px; border-radius: 10px; cursor: pointer;
}
.list button:hover { background: var(--surface-2); }
.list .t { font-weight: 600; font-size: 15px; line-height: 1.2; display: block; }
.list .s { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
.list li.sub button { padding-left: 22px; grid-template-columns: 26px 1fr; }
.list-cap { margin: 6px 8px 8px; font-size: 13px; color: var(--muted); }
.badge {
  display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  background: var(--pin); color: var(--pin-ink); font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1;
  box-shadow: 0 0 0 2px var(--surface);
}
.badge.small { width: 24px; height: 24px; font-size: 13px; }

/* detail */
.back svg { width: 16px; height: 16px; }
.back { border: 0; background: none; color: var(--link); font-weight: 600; cursor: pointer; padding: 4px 0; justify-self: start; display: inline-flex; gap: 6px; align-items: center; }
.d-title { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.d-title .badge { width: 46px; height: 46px; font-size: 24px; }
.d-title h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1; text-wrap: balance; }
.d-title .alt { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.d-desc { margin: 0; font-size: 16px; }
.facts { display: grid; gap: 10px; margin: 0; }
.facts div { display: grid; gap: 2px; }
.facts dt { font-family: var(--f-data); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-size: 14px; }
.coord { font-family: var(--f-data); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.coord span { user-select: all; }
.mini { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; font-family: var(--f-body); }
.sect-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.sect-row .sect { margin: 0; }
.tip { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); background: none; color: var(--muted); font-family: var(--f-data); font-size: 12px; font-weight: 600; cursor: pointer; display: grid; place-items: center; padding: 0; }
.tip[aria-expanded="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tip-pop { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--ink); }
.sect { font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; margin: 6px 0 0; }
.routes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.routes li { border-bottom: 1px solid var(--line); }
.routes button {
  width: 100%; border: 0; background: none; cursor: pointer; text-align: left;
  display: grid; grid-template-columns: 22px 58px 58px 1fr; gap: 8px; align-items: center; padding: 9px 4px;
}
.routes button:hover { background: var(--surface-2); }
.routes .ar { width: 18px; height: 18px; color: var(--accent); }
.routes .az { font-family: var(--f-data); font-weight: 600; font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; }
.routes .m { font-family: var(--f-data); font-size: 14px; font-variant-numeric: tabular-nums; }
.routes .to { display: flex; gap: 8px; align-items: center; min-width: 0; font-size: 14px; }
.routes .to span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* info / contact */
.prose { display: grid; gap: 12px; }
.prose h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.05; }
.prose p { margin: 0; max-width: 62ch; }
.prose ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--f-data); font-size: 13px; font-variant-numeric: tabular-nums; }
.ig-card { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.ig-link {
  display: inline-flex; align-items: center; gap: 10px; justify-self: start; text-decoration: none;
  background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px; font-weight: 700;
}
.ig-handle { font-family: var(--f-data); font-size: 14px; user-select: all; }

/* ---------- map furniture ---------- */
.ctrl { position: absolute; z-index: 700; }
#compass { top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); display: grid; justify-items: end; gap: 8px; }
.rose {
  width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; position: relative;
}
.rose svg { width: 76px; height: 76px; }
.rose-cap { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); font-family: var(--f-data); font-size: 10px; letter-spacing: .06em; padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
.shore { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px 12px; width: 200px; }
.shore h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); text-align: center; }
.shore-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto auto auto; align-items: center; justify-items: center; gap: 2px; }
.shore-grid .c { width: 34px; height: 34px; color: var(--ink); }
.shore-grid .v { text-align: center; line-height: 1.1; }
.shore-grid .v b { display: block; font-family: var(--f-data); font-size: 15px; color: var(--accent); }
.shore-grid .v small { font-size: 11px; color: var(--muted); }
.shore p { margin: 8px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

#zoom { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
#zoom button {
  width: 42px; height: 42px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow);
  cursor: pointer; display: grid; place-items: center; color: var(--ink);
}
#layers { top: 16px; left: 404px; display: grid; gap: 6px; justify-items: start; }
.lay { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
.lay button {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer;
  padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted);
}
.lay button .dot { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid currentColor; display: grid; place-items: center; }
.lay button[aria-pressed="true"] { color: var(--ink); background: var(--surface-2); }
.lay button[aria-pressed="true"] .dot { background: var(--accent); border-color: var(--accent); }
.lay button[aria-pressed="true"] .dot::after { content: ""; width: 6px; height: 3px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.lay-hint { max-width: min(240px, calc(100vw - 140px)); font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.9); padding-left: 4px; }
#scale { left: 404px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); color: #fff; font-family: var(--f-data); font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.9); pointer-events: none; }
#scale .bar { height: 6px; border: 2px solid #fff; border-top: 0; box-shadow: 0 1px 2px rgba(0,0,0,.7); margin-top: 2px; }

/* markers + labels (sit on the photo, so fixed colors) */
.pin {
  width: 100%; height: 100%; border-radius: 50%; background: var(--pin); color: var(--pin-ink);
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1;
  border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.55); box-sizing: border-box; cursor: pointer;
  transition: transform .15s ease;
}
.pin.small { font-size: 12px; border-width: 2px; }
.leaflet-marker-icon.on .pin { transform: scale(1.35); box-shadow: 0 0 0 5px rgba(255,255,255,.55), 0 2px 8px rgba(0,0,0,.6); }
.leaflet-marker-icon.dim .pin { opacity: .55; }
.z-lo .pin { transform: scale(.72); }
.z-lo .leaflet-marker-icon.on .pin { transform: scale(1.1); }
/* whole lake on a phone: smaller pins, helper points (7b, training platforms) hidden unless selected */
.z-xlo .pin { transform: scale(.6); }
.z-xlo .pin.small { display: none; }
.z-xlo .leaflet-marker-icon.on .pin.small { display: grid; }
/* route labels: always centred ON their own line (see layoutLabels) */
.lbl {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; box-sizing: border-box;
  height: 21px; padding: 0 6px; border-radius: 6px; background: rgba(255,255,255,.95);
  border: 1.5px solid #13222a; color: #13222a; box-shadow: 0 1px 3px rgba(0,0,0,.35);
  font-family: var(--f-data); font-size: 12px; font-weight: 600; line-height: 1; pointer-events: none;
}
.lbl.on, .lbl.az { color: #b01a20; border-color: #b01a20; }
.lbl.az.on { background:#b01a20; color:#fff; }
.lbl svg { width: 12px; height: 12px; flex: none; }
.lv-mid .lbl { height: 19px; padding: 0 5px; font-size: 11px; }
.lv-mid .lbl svg { width: 11px; height: 11px; }
.lv-far .lbl { height: 17px; padding: 0 4px; font-size: 10px; border-width: 1.2px; border-radius: 5px; }
.lv-far .lbl svg { width: 10px; height: 10px; }
.leaflet-container { font-family: var(--f-body); background: var(--water); -webkit-tap-highlight-color: transparent; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.leaflet-popup-content { margin: 10px 14px; font-size: 14px; line-height: 1.4; }
.leaflet-popup-content b { font-weight: 700; }
.leaflet-popup-content .pz { font-family: var(--f-data); font-size: 13px; color: var(--accent); display: block; margin-top: 4px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.toast {
  position: absolute; z-index: 900; left: 50%; transform: translateX(-50%); top: 16px;
  background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow);
}

/* ---------- phones: bottom sheet (portrait) / floating card (landscape) ---------- */
/* the same query string is in JS (MQ) */
@media (max-width: 760px), (max-height: 520px) and (orientation: landscape) {
  #panel {
    top: auto; left: 0; right: 0; bottom: 0; width: auto; border-radius: 18px 18px 0 0;
    height: var(--sheet-h); transition: height .25s ease;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #panel.drag { transition: none; }
  #panel .head { display: none; }
  /* sheet bar: drag it, tap it, or use the chevron */
  .sbar { display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; flex: none; border-bottom: 1px solid var(--line); }
  #panel[data-sheet="peek"] .sbar { border-bottom-color: transparent; }
  .handle { display: grid; place-items: center; border: 0; background: none; padding: 8px 0 4px; cursor: grab; width: 100%; }
  .handle span { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
  .sbar-row { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .sbar-t { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .sbar-t .badge { width: 34px; height: 34px; font-size: 18px; flex: none; }
  .sbar-t > div { min-width: 0; }
  .sbar-t h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sbar-t small { display: block; color: var(--muted); font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ib svg { width: 20px; height: 20px; transition: transform .25s ease; }
  #panel[data-sheet="peek"] #sbTog svg { transform: rotate(180deg); }
  /* the bar already shows the title and a close button */
  .back, .d-title, .list-cap { display: none; }
  .view { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .view-pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* menu: title, language, print plan, about, contact */
  #menuBtn {
    display: grid; place-items: center; top: 12px; left: max(16px, env(safe-area-inset-left, 0px));
    width: 42px; height: 42px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); cursor: pointer; color: var(--ink); padding: 0;
  }
  #menuBtn[aria-expanded="true"] { background: var(--ink); color: var(--surface); }
  #menu:not([hidden]) {
    display: block; position: absolute; z-index: 950; top: 62px; left: max(12px, env(safe-area-inset-left, 0px));
    width: min(320px, calc(100vw - 24px)); max-height: calc(100% - 74px); overflow-y: auto;
    background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow);
  }
  #menu .head { padding: 16px; border: 0; gap: 12px; }
  #menu .brand h1 { font-size: 30px; }
  #menu .actions { grid-template-columns: 1fr; }
  #menu .btn-pdf { padding: 10px 12px; }
  #menu .btn-ig { justify-content: flex-start; padding: 10px 12px; }
  #menu .tabs { flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
  #menu .tabs button { text-align: left; padding: 9px 10px; }
  #menu .tabs button[aria-selected="true"] { box-shadow: inset 3px 0 0 var(--accent); }

  #scale { display: none; }
  #zoom { bottom: calc(var(--sheet-h) + 12px); transition: bottom .25s ease; }
  #zoom .zi, #zoom .zo { display: none; }
  #compass { top: 12px; }
  #layers { top: 12px; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 50px); }
  .lay button { padding: 6px 8px; }
  .rose { width: 66px; height: 66px; }
  .rose svg { width: 60px; height: 60px; }
  .shore { width: 184px; }
}
/* phone held sideways: the panel becomes a card in the lower-left corner, the map keeps the whole screen */
@media (max-height: 520px) and (orientation: landscape) {
  #panel { left: max(12px, env(safe-area-inset-left, 0px)); right: auto; width: min(380px, 48vw); }
  .sbar-row { padding-left: 16px; padding-right: 12px; }
  .view { padding-left: 8px; padding-right: 8px; }
  .view-pad { padding-left: 16px; padding-right: 16px; }
  #zoom { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  #compass { top: 10px; }
  #menuBtn, #layers { top: 10px; }
  #menu:not([hidden]) { top: 58px; max-height: calc(100% - 68px); }
  #menu .head { padding: 12px 14px; gap: 8px; }
  #menu .brand h1 { font-size: 24px; }
  #menu .brand p, #menu .btn-pdf small { display: none; }
  #menu .btn-pdf, #menu .btn-ig { padding: 7px 12px; }
  #menu .tabs button { padding: 6px 10px; }
  #app:has(#panel:not([data-sheet="peek"])) .lay-hint { display: none; }
  .rose { width: 56px; height: 56px; }
  .rose svg { width: 50px; height: 50px; }
}

<script>
const D = /*DANE*/;
const IG = 'https://www.instagram.com/deeperbluediving';
const FB = 'https://www.facebook.com/jjbiernacki';
const PDF = { pl: { src: 'plan_PL.pdf', name: 'Koparki_plan_nurkowy.pdf' }, en: { src: 'plan_EN.pdf', name: 'Koparki_dive_plan.pdf' } };

// point numbers by id: a new point shifts the numbering, the texts follow
const N = id => (D.punkty.find(p => p.id === id) || {}).nr;
const T = {
  pl: {
    sub: 'Mapa nurkowa zalanego wyrobiska',
    pdfT: 'Plan do druku', pdfS: 'PDF · A4 · po polsku',
    pdfBusy: 'Przygotowywanie pliku…', pdfSaved: 'Plan zapisany.', pdfDeclined: 'Pobieranie anulowane.',
    pdfFail: 'Nie udało się zapisać pliku.', pdfOpen: 'Otwórz PDF',
    ig: 'Kontakt',
    tList: 'Atrakcje', tInfo: 'O mapie', tContact: 'Kontakt',
    listCap: 'Wybierz punkt na liście lub na mapie, aby wyświetlić trasy i azymuty.',
    back: 'Wszystkie atrakcje',
    alt: 'Nazwa w bazie', coords: 'Współrzędne WGS84', copy: 'Kopiuj', copied: 'Skopiowano',
    routes: 'Trasy z tego punktu', tip: 'Objaśnienie', routesHint: 'Azymuty magnetyczne, zgodne ze wskazaniem kompasu nurkowego, liczone od tego punktu. Wybranie trasy przenosi do punktu docelowego.',
    noRoutes: 'Punkt nie ma własnych tras na planie.',
    depthNote: '* Głębokość zależy od poziomu wody.',
    lyAz: 'Azymuty', lyDist: 'Odległości', lyHint: 'Pozostałe azymuty widoczne po przybliżeniu.', layers: 'Etykiety na mapie',
    rose: 'N mag.', shoreH: 'Do brzegu', shoreP: 'Kursy na brzeg z dowolnego miejsca zbiornika, ±5°.', base: 'baza',
    zIn: 'Przybliż', zOut: 'Oddal', zFit: 'Cała mapa', handle: 'Rozwiń panel', map: 'Mapa',
    sbList: 'Wybierz punkt na mapie lub na liście', sbOpen: 'Rozwiń', sbFold: 'Zwiń', sbClose: 'Zamknij', menu: 'Menu',
    edge: 'trasa',
    info: `
      <h2>O mapie</h2>
      <p>Podkład stanowi ortofotomapa z drona z 13.09.2026. Punkty, trasy i azymuty są zgodne z planem do druku.</p>
      <ul>
        <li><b>Azymuty są magnetyczne</b> i odpowiadają wskazaniom kompasu nurkowego. Deklinacja wynosi +6,3°E: azymut rzeczywisty = magnetyczny + 6°.</li>
        <li>Azymut zależy od kierunku: wartość z A do B różni się od wartości z B do A. Na mapie azymut podano przy punkcie początkowym trasy. Azymut wskazuje kierunek, a nie dokładny cel.</li>
        <li>Pozycje atrakcji wyznaczone na podstawie położenia boi mogą być nieznacznie przesunięte.</li>
        <li>Głębokości oznaczone gwiazdką zależą od poziomu wody.</li>
        <li>Wilhelm: punkt ${N('lina')} to miejsce przypięcia poręczówki z Głębokiej koparki (${N('9')}), punkt ${N('dz')} to dziób. Kadłub ma ok. 16,5 × 3,5 m, kurs rufa→dziób 90°.</li>
        <li>Platformy szkoleniowe (${N('16')}, ${N('17')}) znajdują się na głębokości 5 m, przy trasach ${N('5')}–${N('15')} i ${N('14')}–${N('15')}, i nie mają własnych tras. Kolejna platforma szkoleniowa znajduje się pod Pomostem II (${N('3')}).</li>
        <li>Deco bar (${N('deco')}): rurki PCV na różnych głębokościach do ćwiczenia pływalności, obok Pomostu II.</li>
        <li>Kompas w prawym górnym rogu wskazuje północ magnetyczną. Po jego wybraniu wyświetlają się kursy na brzeg.</li>
      </ul>`,
    contact: `
      <h2>Uwagi i poprawki</h2>
      <p>Mapa powstała na podstawie zdjęć z drona i pomiarów pod wodą. Uwagi, poprawki oraz propozycje nowych punktów proszę przesyłać przez Instagram lub Facebook.</p>
      <p>Najbardziej pomocne są: numer punktu, opis problemu oraz źródło informacji, na przykład azymut i odległość zmierzone pod wodą.</p>`,
    igBtn: 'Wyślij wiadomość na Instagramie', fbBtn: 'Wyślij wiadomość na Facebooku'
  },
  en: {
    sub: 'Dive map of a flooded quarry',
    pdfT: 'Print plan', pdfS: 'PDF · A4 · in English',
    pdfBusy: 'Preparing the file…', pdfSaved: 'Plan saved.', pdfDeclined: 'Download cancelled.',
    pdfFail: 'Could not save the file here.', pdfOpen: 'Open the PDF',
    ig: 'Contact',
    tList: 'Sites', tInfo: 'About', tContact: 'Contact',
    listCap: 'Select a site in the list or on the map to show its routes and bearings.',
    back: 'All sites',
    alt: 'Local name', coords: 'WGS84 coordinates', copy: 'Copy', copied: 'Copied',
    routes: 'Routes from here', tip: 'Explanation', routesHint: 'Magnetic bearings from this point, as shown by a dive compass. Selecting a route moves to its destination.',
    noRoutes: 'This point has no routes of its own on the plan.',
    depthNote: '* Depth depends on the water level.',
    lyAz: 'Bearings', lyDist: 'Distances', lyHint: 'More bearings show when zoomed in.', layers: 'Map labels',
    rose: 'mag. N', shoreH: 'To shore', shoreP: 'Courses to shore from anywhere in the lake, ±5°.', base: 'base',
    zIn: 'Zoom in', zOut: 'Zoom out', zFit: 'Whole map', handle: 'Expand panel', map: 'Map',
    sbList: 'Pick a site on the map or in the list', sbOpen: 'Expand', sbFold: 'Collapse', sbClose: 'Close', menu: 'Menu',
    edge: 'route',
    info: `
      <h2>About this map</h2>
      <p>The base layer is a drone orthophoto from 13 Sep 2026. Points, routes and bearings match the print plan.</p>
      <ul>
        <li><b>Bearings are magnetic</b> and correspond to a dive compass reading. Declination is +6.3°E: true bearing = magnetic + 6°.</li>
        <li>A bearing depends on direction: the value from A to B differs from the value from B to A. On the map, the bearing is shown at the starting point of the route. A bearing gives direction, not a precise aim.</li>
        <li>Positions of sites determined from buoy locations may be slightly offset.</li>
        <li>Depths marked with an asterisk depend on the water level.</li>
        <li>Wilhelm: point ${N('lina')} is where the guideline from the Deep excavator (${N('9')}) is tied, point ${N('dz')} is the bow. The hull is about 16.5 × 3.5 m, stern→bow 90°.</li>
        <li>Training platforms (${N('16')}, ${N('17')}) are at a depth of 5 m, by routes ${N('5')}–${N('15')} and ${N('14')}–${N('15')}, and have no routes of their own. Another training platform is under Jetty II (${N('3')}).</li>
        <li>Deco bar (${N('deco')}): PVC pipes at different depths for buoyancy practice, next to Jetty II.</li>
        <li>The compass in the top right corner shows magnetic north. Selecting it displays courses to shore.</li>
      </ul>`,
    contact: `
      <h2>Feedback and corrections</h2>
      <p>The map is based on drone photographs and underwater measurements. Please send comments, corrections and suggestions for new points via Instagram or Facebook.</p>
      <p>Most helpful: the point number, a description of the issue and its source, for example a bearing and distance measured underwater.</p>`,
    igBtn: 'Send a message on Instagram', fbBtn: 'Send a message on Facebook'
  }
};

let lang = 'pl';
try { const s = localStorage.getItem('koparki-lang'); if (s === 'en' || s === 'pl') lang = s; } catch (e) {}
const t = () => T[lang];
function n(v) { return Number(v).toLocaleString(lang === 'pl' ? 'pl-PL' : 'en-GB', { maximumFractionDigits: 1 }); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ------------------------------------------------------------ data
const P = {}; D.punkty.forEach(p => P[p.id] = p);
const byNr = {}; D.punkty.forEach(p => byNr[p.nr] = p);
const name = p => lang === 'pl' ? p.pl : p.en;
const desc = p => lang === 'pl' ? p.opis_pl : p.opis_en;
const order = D.punkty.slice().sort((a, b) => (parseInt(a.nr) - parseInt(b.nr)) || a.nr.localeCompare(b.nr));
function routesOf(id) {
  return D.krawedzie.filter(k => k.a === id || k.b === id).map(k => {
    const from = k.a === id, o = P[from ? k.b : k.a];
    return { k, other: o, az: from ? k.ab : k.ba, m: k.m, dx: o.x - P[id].x, dy: o.y - P[id].y };
  }).sort((u, v) => u.m - v.m);
}
const az = v => (Math.floor(v + 0.5) % 360) + '°';   // same rounding as the print plan
const dm = v => Math.round(v) + ' m';
const arrow = (dx, dy, cls) => `<svg class="${cls || ''}" viewBox="0 0 16 16" style="transform:rotate(${Math.atan2(dy, dx) * 180 / Math.PI}deg)" aria-hidden="true"><path d="M2 8h10M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// ------------------------------------------------------------ map
const ZN = D.zmax;
const map = L.map('map', {
  crs: L.CRS.Simple, zoomControl: false, attributionControl: false,
  zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 90, maxZoom: ZN + 2, minZoom: -3,
  bounceAtZoomLimits: false
});
const LL = (x, y) => map.unproject([x, y], ZN);
const imgB = L.latLngBounds(LL(0, D.wys), LL(D.szer, 0));
L.tileLayer('kafle/{z}/{x}_{y}.jpg', {
  tileSize: D.kafel, minNativeZoom: 0, maxNativeZoom: ZN, minZoom: -3, maxZoom: ZN + 2,
  bounds: imgB, noWrap: true, keepBuffer: 3, updateWhenIdle: false
}).addTo(map);
// generous vertical slack: the lake is a wide strip, and on a phone in portrait the
// panel covers half the screen, so a tight box would pin the view to the middle
map.setMaxBounds(L.latLngBounds(LL(-D.szer * 0.25, D.wys * 2.5), LL(D.szer * 1.25, -D.wys * 1.5)));

// Wilhelm hull outline
D.obrysy.forEach(o => {
  L.polygon(o.px.map(([x, y]) => LL(x, y)), { color: '#fff', weight: 2.5, opacity: .95, fillColor: '#fff', fillOpacity: .18, dashArray: '6 4', interactive: false }).addTo(map);
});

// routes
const lines = [];
D.krawedzie.forEach(k => {
  const a = P[k.a], b = P[k.b], ll = [LL(a.x, a.y), LL(b.x, b.y)];
  const casing = L.polyline(ll, { color: '#fff', weight: 5, opacity: .8, interactive: false }).addTo(map);
  const core = L.polyline(ll, { color: '#13222a', weight: 2.2, opacity: .95, interactive: false }).addTo(map);
  const hit = L.polyline(ll, { color: '#000', weight: 18, opacity: 0, bubblingMouseEvents: false }).addTo(map);
  hit.on('click', e => edgePopup(k, e.latlng));
  const lbl = L.marker(LL((a.x + b.x) / 2, (a.y + b.y) / 2), {
    interactive: false, keyboard: false,
    icon: L.divIcon({ className: '', html: `<div class="lbl">${dm(k.m)}</div>`, iconSize: [0, 0] })
  }).addTo(map);
  lines.push({ k, casing, core, lbl, txt: dm(k.m) });
});
function edgePopup(k, at) {
  const a = P[k.a], b = P[k.b];
  L.popup({ maxWidth: 260 }).setLatLng(at).setContent(
    `<b>${esc(a.nr)} ${esc(name(a))} ↔ ${esc(b.nr)} ${esc(name(b))}</b><br>${dm(k.m)}` +
    `<span class="pz">${esc(a.nr)} → ${esc(b.nr)}: ${az(k.ab)}<br>${esc(b.nr)} → ${esc(a.nr)}: ${az(k.ba)}</span>`
  ).openOn(map);
}

// points
const marks = {};
D.punkty.forEach(p => {
  const small = p.maly || p.nr === '7b', s = small ? 22 : 30;
  const m = L.marker(LL(p.x, p.y), {
    title: `${p.nr} ${name(p)}`, riseOnHover: true,
    icon: L.divIcon({ className: '', html: `<div class="pin${small ? ' small' : ''}">${esc(p.nr)}</div>`, iconSize: [s, s], iconAnchor: [s / 2, s / 2] })
  }).addTo(map);
  m.on('click', () => select(p.id, { move: map.getZoom() < 2 ? 'fit' : 'reveal' }));
  marks[p.id] = m;
});
const leaders = L.layerGroup().addTo(map);
const genAz = [];
D.krawedzie.forEach(k => [[k.a, k.b, k.ab], [k.b, k.a, k.ba]].forEach(([f, t_, a]) => {
  const dx = P[t_].x - P[f].x, dy = P[t_].y - P[f].y;
  const mk = L.marker(LL(P[f].x, P[f].y), { interactive: false, keyboard: false, zIndexOffset: 900,
    icon: L.divIcon({ className: '', html: `<div class="lbl az">${arrow(dx, dy)}${az(a)}</div>`, iconSize: [0, 0] }) }).addTo(map);
  genAz.push({ mk, from: f, to: t_, txt: az(a) });
}));
let showAz = true, showDist = true;
try { const v = JSON.parse(localStorage.getItem('koparki-labels') || '{}'); if (v.az === false) showAz = false; if (v.dist === false) showDist = false; } catch (e) {}

// ------------------------------------------------------------ panel
const $ = id => document.getElementById(id);
const MQ = '(max-width: 760px), (max-height: 520px) and (orientation: landscape)';   // same as the CSS
const mq = window.matchMedia(MQ);
const mqSide = window.matchMedia('(max-height: 520px) and (orientation: landscape)');
let view = 'list', sel = null, sheet = 'peek';

// sheet heights: portrait = peek / half / full, landscape card = peek / full
function snaps() {
  const H = $('app').clientHeight, pk = peekH();
  return mqSide.matches ? { peek: pk, full: Math.max(pk, H - 62) }   // leaves the menu button uncovered
    : { peek: pk, half: Math.max(pk, Math.round(H * 0.5)), full: Math.max(pk, H - 70) };
}
function setH(h) { document.documentElement.style.setProperty('--sheet-h', Math.round(h) + 'px'); }
function curH() { return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sheet-h')) || 0; }
function setSheet(s) {
  if (!mq.matches) { sheet = s; setH(0); return; }
  const S = snaps();
  if (!(s in S)) s = s === 'half' ? 'full' : 'half';
  sheet = s; setH(S[s]);
  $('panel').dataset.sheet = s;
  const L_ = t(), open = s !== 'peek';
  $('handle').setAttribute('aria-expanded', String(open));
  $('sbTog').setAttribute('aria-expanded', String(open));
  $('sbTog').setAttribute('aria-label', open ? L_.sbFold : L_.sbOpen);
}
function peekH() { return $('sbar').offsetHeight + 2; }
function toggleSheet() { setSheet(sheet === 'peek' ? (mqSide.matches ? 'full' : 'half') : 'peek'); }
function openSheet() { if (mq.matches && sheet === 'peek') setSheet(mqSide.matches ? 'full' : 'half'); }

// drag the bar to resize; a short tap on the bar toggles
let drag = null, noClick = false;
$('sbar').addEventListener('pointerdown', e => {
  if (!mq.matches || e.target.closest('.ib') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = { y: e.clientY, h: curH(), py: e.clientY, pt: performance.now(), v: 0, moved: false };
  try { $('sbar').setPointerCapture(e.pointerId); } catch (_) {}
});
$('sbar').addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dy) < 6) return;
  drag.moved = true; $('panel').classList.add('drag');
  const S = snaps(), now = performance.now();
  setH(Math.min(S.full, Math.max(S.peek, drag.h - dy)));
  if (now > drag.pt) drag.v = (e.clientY - drag.py) / (now - drag.pt);   // px/ms, + = down
  drag.py = e.clientY; drag.pt = now;
});
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null; $('panel').classList.remove('drag');
  if (cancel) { setSheet(sheet); return; }
  if (!d.moved) { if (!e.target.closest('button')) toggleSheet(); return; }
  noClick = true; setTimeout(() => noClick = false, 0);
  const S = snaps(), keys = Object.keys(S).sort((a, b) => S[a] - S[b]), h = curH();
  let k;
  if (Math.abs(d.v) > 0.4) {
    // a flick goes to the next stop in its direction
    k = d.v > 0 ? keys.slice().reverse().find(x => S[x] < h - 4) || keys[0]
                : keys.find(x => S[x] > h + 4) || keys[keys.length - 1];
  } else k = keys.reduce((a, b) => Math.abs(S[b] - h) < Math.abs(S[a] - h) ? b : a);
  setSheet(k);
}
$('sbar').addEventListener('pointerup', e => endDrag(e, false));
$('sbar').addEventListener('pointercancel', e => endDrag(e, true));
$('handle').onclick = e => { if (noClick || e.detail) return; toggleSheet(); };   // keyboard only; taps are handled by the bar
$('sbTog').onclick = () => toggleSheet();
$('sbClose').onclick = () => {
  if (view === 'detail') deselect();
  else { view = sel ? 'detail' : 'list'; render(); }
};

// the panel head (title, language, print plan, tabs) lives in the menu on phones
function placeHead() {
  const head = document.querySelector('.head');
  if (mq.matches) { if (head.parentNode !== $('menu')) $('menu').appendChild(head); }
  else { if (head.parentNode !== $('panel')) $('panel').insertBefore(head, $('body')); closeMenu(); }
}
function closeMenu() { $('menu').hidden = true; $('menuBtn').setAttribute('aria-expanded', 'false'); }
$('menuBtn').onclick = e => {
  e.stopPropagation();
  const h = !$('menu').hidden; $('menu').hidden = h; $('menuBtn').setAttribute('aria-expanded', String(!h));
};
document.addEventListener('pointerdown', e => {
  if (!$('menu').hidden && !e.target.closest('#menu, #menuBtn')) closeMenu();
});

// ------------------------------------------------------------ selection
function panelPad() {
  if (mq.matches && mqSide.matches) {
    const r = $('panel').getBoundingClientRect();
    return sheet === 'peek' ? { tl: [24, 70], br: [70, curH() + 16] } : { tl: [r.right + 20, 70], br: [70, 24] };
  }
  if (mq.matches) return { tl: [24, 90], br: [24, curH() + 24] };
  return { tl: [372 + 16 + 30, 30], br: [30 + 70, 30] };
}
function drawSel() {
  Object.entries(marks).forEach(([id, m]) => {
    const el = m.getElement(); if (!el) return;
    el.classList.toggle('on', id === sel);
  });
  lines.forEach(l => {
    const on = sel && (l.k.a === sel || l.k.b === sel);
    l.core.setStyle(on ? { color: '#b01a20', weight: 3.4 } : { color: '#13222a', weight: 2.2, opacity: sel ? .6 : .95 });
    l.casing.setStyle({ opacity: sel && !on ? .45 : .8 });
    const d = l.lbl.getElement() && l.lbl.getElement().querySelector('.lbl');
    if (d) d.classList.toggle('on', !!on);
    l.on = !!on;
  });

// ------------------------------------------------------------ label layout
// Each label sits centred ON its own route line, so it is always clear which
// route it belongs to. It slides along that line (never off it) until it touches
// neither a point marker nor another label. Bearings of the selected point go
// first and start next to that point; distances go next, short routes before long
// ones. When a label of the selected point has no room on its line (zoomed out,
// short route), it moves beside the line and a dashed leader joins it to its
// anchor. Other distances with no free slot are hidden until zooming in makes room.
const cv = document.createElement('canvas').getContext('2d');
// Level of detail by zoom: far = whole lake, mid = part of it, near = close-up.
// far: only the bearings of the selected point, small labels;
// mid: distances too, medium labels; near: everything at full size.
function lod() {
  const z = map.getZoom();
  if (z < 1.75) return { cls: 'lv-far', fs: 10, h: 17, pad: 4, ic: 10, dist: false };
  if (z < 3)    return { cls: 'lv-mid', fs: 11, h: 19, pad: 5, ic: 11, dist: true };
  return               { cls: 'lv-near', fs: 12, h: 21, pad: 6, ic: 12, dist: true };
}
function lblW(txt, arrowed, v) {
  cv.font = `600 ${v.fs}px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace`;
  return Math.ceil(cv.measureText(txt).width) + 2 * v.pad + 4 + (arrowed ? v.ic + 3 : 0);
}
function pinR(id) {
  const p = P[id], small = p.maly || p.nr === '7b', base = small ? 11 : 15, z = map.getZoom(), lo = z < 1.25;
  if (z < 0.75) return small ? 0 : base * 0.6 + 2;
  return base * (lo ? 0.72 : 1) + 2;
}
function vis(mk, on) { const el = mk.getElement(); if (el) el.style.display = on ? '' : 'none'; }
function layoutLabels() {
  if (!map._loaded) return;   // before the first fitBounds there is no view yet
  const v = lod(), H = v.h, GAP = 3, c = map.getContainer();
  ['lv-far', 'lv-mid', 'lv-near'].forEach(k => c.classList.toggle(k, k === v.cls));
  const lp = {}; Object.keys(P).forEach(id => lp[id] = map.latLngToLayerPoint(LL(P[id].x, P[id].y)));
  const boxes = Object.keys(P).map(id => { const c = lp[id], r = pinR(id); return [c.x - r, c.y - r, c.x + r, c.y + r]; });
  const free = b => !boxes.some(q => b[0] < q[2] + GAP && q[0] < b[2] + GAP && b[1] < q[3] + GAP && q[1] < b[3] + GAP);
  leaders.clearLayers();
  const show = (mk, x, y, b) => { boxes.push(b); mk.setLatLng(map.layerPointToLatLng([x, y])); vis(mk, true); };
  const geom = (aId, bId, w) => {
    const A = lp[aId], B = lp[bId], dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len, e = w / 2 * Math.abs(ux) + H / 2 * Math.abs(uy);
    return { A, len, ux, uy, smin: pinR(aId) + e + GAP, smax: len - pinR(bId) - e - GAP };
  };
  const box = (x, y, w) => [x - w / 2, y - H / 2, x + w / 2, y + H / 2];
  // 1) on the line: slide along A->B, from the start or outwards from the middle
  function onLine(mk, aId, bId, w, prefer) {
    const g = geom(aId, bId, w);
    if (g.smin > g.smax) return false;
    const ss = [];
    if (prefer === 'start') for (let s = g.smin; s <= g.smax; s += 5) ss.push(s);
    else { const mid = (g.smin + g.smax) / 2; for (let d = 0; d <= (g.smax - g.smin) / 2 + 0.1; d += 5) { ss.push(mid - d); if (d) ss.push(mid + d); } }
    for (const s of ss) {
      const x = g.A.x + g.ux * s, y = g.A.y + g.uy * s, b = box(x, y, w);
      if (free(b)) { show(mk, x, y, b); return true; }
    }
    return false;
  }
  // 2) no room on the line: the label moves to the nearest free spot beside it
  //    and a thin leader joins it to its anchor on the line
  function callout(mk, aId, bId, w, prefer, color) {
    const g = geom(aId, bId, w);
    const s0 = prefer === 'start' ? Math.min(pinR(aId) + 10, g.len / 2) : g.len / 2;
    const ax = g.A.x + g.ux * s0, ay = g.A.y + g.uy * s0, base = Math.atan2(g.uy, g.ux);
    const turns = [90, -90, 60, -60, 120, -120, 30, -30, 150, -150, 0, 180];
    for (const r of [30, 44, 60, 78, 98, 120, 145]) for (const t of turns) {
      const an = base + t * Math.PI / 180, x = ax + Math.cos(an) * (r + w / 4), y = ay + Math.sin(an) * r, b = box(x, y, w);
      if (free(b)) {
        show(mk, x, y, b);
        L.polyline([map.layerPointToLatLng([ax, ay]), map.layerPointToLatLng([x, y])],
          { color, weight: 1.6, dashArray: '3 3', opacity: .95, interactive: false }).addTo(leaders);
        L.circleMarker(map.layerPointToLatLng([ax, ay]), { radius: 2.5, color, weight: 0, fillColor: color, fillOpacity: 1, interactive: false }).addTo(leaders);
        return true;
      }
    }
    return false;
  }
  const scr = (a, b) => Math.hypot(lp[a].x - lp[b].x, lp[a].y - lp[b].y);
  // ONE layout for the current zoom, independent of the checkboxes and of the
  // selection: all bearings first, then all distances. The checkboxes and the
  // selection only decide what is shown, so nothing moves or vanishes by itself.
  const ok = new Map();
  genAz.slice().sort((u, w) => scr(u.from, u.to) - scr(w.from, w.to))
    .forEach(m => ok.set(m, onLine(m.mk, m.from, m.to, lblW(m.txt, true, v), 'start')));
  if (v.dist) lines.slice().sort((u, w) => scr(u.k.a, u.k.b) - scr(w.k.a, w.k.b))
    .forEach(l => ok.set(l, onLine(l.lbl, l.k.a, l.k.b, lblW(l.txt, false, v), 'mid')));
  // labels of the selected point that found no room get a callout with a leader
  if (sel) {
    genAz.filter(m => m.from === sel && !ok.get(m))
      .forEach(m => ok.set(m, callout(m.mk, m.from, m.to, lblW(m.txt, true, v), 'start', '#b01a20')));
    lines.filter(l => l.on && !ok.get(l))
      .forEach(l => ok.set(l, callout(l.lbl, l.k.a, l.k.b, lblW(l.txt, false, v), 'mid', '#b01a20')));
  }
  genAz.forEach(m => vis(m.mk, !!ok.get(m) && showAz));
  lines.forEach(l => vis(l.lbl, !!ok.get(l) && showDist));
  $('lyHint').hidden = !(showAz && genAz.some(m => !ok.get(m)));
}
function select(id, opt) {
  sel = id; view = 'detail';
  render(); drawSel();
  try { history.replaceState(null, '', '#p' + P[id].nr); } catch (e) {}
  openSheet();
  const p = P[id], ll = LL(p.x, p.y), pad = panelPad();
  if (opt && opt.move === 'fit') {
    const pts = [ll].concat(routesOf(id).map(r => LL(r.other.x, r.other.y)));
    map.flyToBounds(L.latLngBounds(pts), { paddingTopLeft: pad.tl, paddingBottomRight: pad.br, maxZoom: ZN - 1, duration: .6 });
  } else {
    // keep the map where it is, but bring the point out from under the panel
    setTimeout(() => {
      const c = map.latLngToContainerPoint(ll), s = map.getSize();
      const minX = pad.tl[0], maxX = s.x - pad.br[0], minY = pad.tl[1], maxY = s.y - pad.br[1];
      const dx = c.x < minX ? c.x - minX - 20 : c.x > maxX ? c.x - maxX + 20 : 0;
      const dy = c.y < minY ? c.y - minY - 20 : c.y > maxY ? c.y - maxY + 20 : 0;
      if (dx || dy) map.panBy([dx, dy]);
    }, 280);
  }
}
function deselect() {
  sel = null; view = 'list'; render(); drawSel(); map.closePopup();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}

// ------------------------------------------------------------ furniture
function zoomCls() {
  const z = map.getZoom(), c = map.getContainer();
  c.classList.toggle('z-lo', z < 1.25);
  c.classList.toggle('z-xlo', z < 0.75);
  lines.forEach(l => l.casing.setStyle({ weight: z < 1 ? 3.5 : 5 }));
  const mpp = D.gsd * Math.pow(2, ZN - z), target = mpp * 110;
  const nice = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500].find(v => v >= target) || 500;
  const best = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500].filter(v => v <= target).pop() || nice;
  $('scaleBar').style.width = (best / mpp).toFixed(0) + 'px';
  $('scaleTxt').textContent = best + ' m';
}
map.on('zoomend', () => { zoomCls(); layoutLabels(); });
map.on('click', () => { closeMenu(); if (mq.matches && sheet !== 'peek') setSheet('peek'); });
function syncLayers() {

  try { localStorage.setItem('koparki-labels', JSON.stringify({ az: showAz, dist: showDist })); } catch (e) {}
  layoutLabels();
}
$('lyAz').onclick = () => { showAz = !showAz; syncLayers(); };
$('lyDist').onclick = () => { showDist = !showDist; syncLayers(); };
$('lyAz').setAttribute('aria-pressed', String(showAz)); $('lyDist').setAttribute('aria-pressed', String(showDist));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutLabels());
$('needle').setAttribute('transform', `rotate(${D.polnoc_mag})`);
$('roseBtn').onclick = () => { const h = $('shore'); h.hidden = !h.hidden; $('roseBtn').setAttribute('aria-expanded', String(!h.hidden)); };
$('zIn').onclick = () => map.zoomIn(0.75);
$('zOut').onclick = () => map.zoomOut(0.75);
function fitAll(animate) {
  const ptsB = L.latLngBounds(D.punkty.map(p => LL(p.x, p.y))).pad(0.06), pad = panelPad();
  map.fitBounds(ptsB, { paddingTopLeft: pad.tl, paddingBottomRight: pad.br, animate: !!animate });
}
$('zFit').onclick = () => fitAll(true);
function refit() {
  map.setMinZoom(-3); fitAll(false);
  map.setMinZoom(Math.min(map.getZoom() - 0.75, 0));
}

let busy = false;
async function savePdf() {
  if (busy) return; busy = true;
  const L_ = t(), f = PDF[lang], btn = $('pdfBtn'), st = $('status');
  btn.setAttribute('aria-busy', 'true'); st.textContent = L_.pdfBusy;
  const fallback = () => { st.innerHTML = `${L_.pdfFail} <a href="${f.src}" target="_blank" rel="noopener">${L_.pdfOpen}</a>`; };
  try {
    const a = document.createElement('a'); a.href = f.src; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();

}
